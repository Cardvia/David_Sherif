<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Cardvia · David Sherif</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .glass-card {
      background: rgba(var(--card-bg-rgb, 28, 10, 8), 0.75);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .fade-in {
      animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .btn-shine {
      position: relative;
      overflow: hidden;
    }
    .btn-shine::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transform: rotate(45deg);
      transition: all 0.5s ease;
      opacity: 0;
    }
    .btn-shine:hover::after {
      opacity: 1;
      left: 100%;
    }
  </style>
</head>
<body class="bg-[#1C0A08] text-white min-h-screen flex items-center justify-center p-4">

  <div id="root" class="w-full max-w-md mx-auto fade-in"></div>

  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.22.5/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ====== CONFIGURATION (متوافق تماماً مع تصميم الكارد) ======
    const CONFIG = {
      // ---------- البيانات الشخصية المستخرجة من الكارد ----------
      fullName: 'David Sherif',
      jobTitle: 'Digital Business Card',
      arabicTitle: '',
      bio: '',

      // ---------- الصور ----------
      profileImage: 'https://ik.imagekit.io/fojb8puzo/David_Sherif', 
      profileImageSize: 'w-36 h-36 sm:w-48 sm:h-48',
      coverImage: '', 

      // ---------- أزرار التواصل المستخرجة من الكارد ----------
      contacts: [
        { icon: 'fa-solid fa-phone', label: 'Call', url: 'tel:+201003662276' },
        { icon: 'fa-brands fa-whatsapp', label: 'WhatsApp', url: 'https://wa.me/201283095500' },
        { icon: 'fa-regular fa-envelope', label: 'Email', url: 'mailto:david.sherif2000@gmail.com' },
        { icon: 'fa-solid fa-coins', label: 'Instapay', url: 'https://ipn.eg/' },
      ],
      
      // ---------- روابط التواصل الاجتماعي (تم إزالة LinkedIn) ----------
      socials: [
        { icon: 'fa-brands fa-instagram', url: 'https://www.instagram.com/david.sherif2000', label: 'Instagram' },
        { icon: 'fa-brands fa-facebook', url: 'https://www.facebook.com/david.sherif.338', label: 'Facebook' }
      ],

      // ---------- رمز QR ----------
      qrCodeImageUrl: '', 

      // ---------- الألوان المتوافقة مع الكارد (بني داكن + أبيض) ----------
      colors: {
        cardBg: '28, 10, 8',             
        textPrimary: '#ffffff',          
        textSecondary: '#E5E7EB',        
        textMuted: '#9CA3AF',            
        buttonBg: '#ffffff',             
        buttonText: '#1C0A08',           
        buttonBorder: '255, 255, 255',   
        socialIcon: '#ffffff',            
        qrBg: '#ffffff',                  
        footerText: '#6B7280',            
        border: '255, 255, 255',          
      },

      // ---------- بيانات vCard التلقائية ----------
      vCard: {
        fn: 'David Sherif',
        org: '',
        title: '',
        tel: '+201003662276',
        email: 'david.sherif2000@gmail.com',
        url: ''
      },

      // ---------- رقم واتساب لطلب البطاقة ----------
      whatsappRequestNumber: '+201090225298',
    };

    const trackClick = (label) => {
      if (typeof gtag !== 'undefined') {
        gtag('event', 'button_click', { event_category: 'engagement', event_label: label });
      }
    };

    const downloadVcard = () => {
      trackClick('download_vcard');
      const vcard = `BEGIN:VCARD
VERSION:3.0
FN:${CONFIG.vCard.fn || CONFIG.fullName}
ORG:${CONFIG.vCard.org}
TITLE:${CONFIG.vCard.title}
TEL:${CONFIG.vCard.tel}
EMAIL:${CONFIG.vCard.email}
URL:${CONFIG.vCard.url}
END:VCARD`;
      const blob = new Blob([vcard], { type: 'text/vcard' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${CONFIG.fullName.replace(/\s+/g, '_')}.vcf`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    const downloadQR = () => {
      trackClick('download_qr');
      if (CONFIG.qrCodeImageUrl) {
        const a = document.createElement('a');
        a.href = CONFIG.qrCodeImageUrl;
        a.download = `${CONFIG.fullName.replace(/\s+/g, '_')}_QR.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    };

    function DigitalBusinessCard() {
      const colors = CONFIG.colors;

      return (
        <div 
          className="glass-card rounded-3xl shadow-2xl overflow-hidden border transition-all duration-500"
          style={{
            backgroundColor: `rgba(${colors.cardBg}, 0.85)`,
            borderColor: `rgba(${colors.border}, 0.08)`,
          }}
        >
          {/* الغلاف والبروفايل */}
          <div className="relative h-48 bg-[#150706] flex items-center justify-center border-b border-white/5">
            {CONFIG.coverImage && (
              <div className="absolute inset-0 bg-cover bg-center" style={{ backgroundImage: `url('${CONFIG.coverImage}')` }}></div>
            )}
            
            {/* صورة البروفايل */}
            <div className="absolute -bottom-12 left-1/2 transform -translate-x-1/2">
              <div className={`${CONFIG.profileImageSize} rounded-full border-4 shadow-2xl overflow-hidden bg-[#1C0A08]`} 
                   style={{ borderColor: `rgba(${colors.border}, 0.1)` }}>
                <img 
                  src={CONFIG.profileImage} 
                  alt={CONFIG.fullName}
                  className="w-full h-full object-cover"
                  onError={(e) => e.target.src = 'https://via.placeholder.com/400?text=David'}
                />
              </div>
            </div>
          </div>

          {/* المحتوى الرئيسي */}
          <div className="pt-16 sm:pt-20 pb-6 px-5 sm:px-6 space-y-6">
            {/* الاسم + المسمى الوظيفي */}
            <div className="text-center space-y-1">
              <h1 className="text-3xl sm:text-4xl font-bold tracking-tight" style={{ color: colors.textPrimary }}>
                {CONFIG.fullName}
              </h1>
              <h2 className="text-sm uppercase tracking-widest font-medium opacity-80" style={{ color: colors.textSecondary }}>
                {CONFIG.jobTitle}
              </h2>
            </div>

            {/* أزرار التواصل */}
            <div className="grid grid-cols-1 gap-3">
              {CONFIG.contacts.map((btn, idx) => (
                <a
                  key={idx}
                  href={btn.url}
                  target="_blank" rel="noopener noreferrer"
                  className="flex items-center gap-4 px-5 py-4 rounded-xl font-medium backdrop-blur-sm transition-all hover:bg-white/10 active:scale-[0.98] border border-white/5"
                  style={{
                    backgroundColor: 'rgba(255, 255, 255, 0.03)',
                    color: colors.textPrimary,
                  }}
                  onClick={() => trackClick(`contact_${btn.label}`)}
                  aria-label={btn.label}
                >
                  <i className={`${btn.icon} text-xl w-8 text-white/90`}></i>
                  <span className="flex-1 text-left text-sm tracking-wide">{btn.label}</span>
                  <i className="fa-solid fa-chevron-right text-xs opacity-30"></i>
                </a>
              ))}
            </div>

            {/* أيقونات السوشيال ميديا */}
            <div className="flex justify-center items-center gap-6 pt-2">
              {CONFIG.socials.map((social, idx) => (
                <a
                  key={idx}
                  href={social.url}
                  target="_blank" rel="noopener noreferrer"
                  className="text-2xl hover:scale-110 transition-transform p-2 opacity-80 hover:opacity-100"
                  style={{ color: colors.socialIcon }}
                  onClick={() => trackClick(`social_${social.label}`)}
                  aria-label={social.label}
                >
                  <i className={social.icon}></i>
                </a>
              ))}
            </div>

            {/* رمز QR */}
            {CONFIG.qrCodeImageUrl && (
              <div className="flex justify-center pt-2">
                <div className="relative group cursor-pointer" onClick={downloadQR}>
                  <div className="w-32 h-32 rounded-2xl p-2 bg-white shadow-xl hover:scale-105 transition-transform duration-300">
                    <img 
                      src={CONFIG.qrCodeImageUrl} 
                      alt="QR Code"
                      className="w-full h-full object-contain"
                    />
                  </div>
                  <p className="text-center text-xs mt-2 opacity-60" style={{ color: colors.textPrimary }}>
                    اضغط لتحميل QR
                  </p>
                </div>
              </div>
            )}

            {/* أزرار الإجراءات الرئيسية */}
            <div className="flex flex-col items-center gap-3 pt-4">
              <button
                onClick={downloadVcard}
                className="w-full flex items-center justify-center gap-3 px-5 py-4 rounded-xl font-bold shadow-lg transition-all active:scale-[0.98] btn-shine"
                style={{
                  background: colors.buttonBg,
                  color: colors.buttonText,
                }}
              >
                <i className="fa-solid fa-address-card text-lg"></i>
                <span className="text-sm tracking-wide">Download vCard</span>
              </button>

              <a
                href={`https://wa.me/${CONFIG.whatsappRequestNumber}`}
                target="_blank" rel="noopener noreferrer"
                className="w-full flex items-center justify-center gap-3 px-5 py-4 rounded-xl font-bold transition-all active:scale-[0.98] border border-white/20 hover:bg-white/5"
                style={{
                  color: colors.textPrimary,
                }}
              >
                <i className="fa-regular fa-id-card text-lg"></i>
                <span className="text-sm tracking-wide">Request Your Card</span>
              </a>
            </div>

            {/* التذييل */}
            <div className="pt-6 text-center">
              <span className="text-[0.65rem] font-medium tracking-[0.25em] opacity-40">
                POWERED BY CARDVIA
              </span>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DigitalBusinessCard />);
  </script>
</body>
</html>
